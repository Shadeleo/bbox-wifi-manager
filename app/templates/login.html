<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bbox WiFi Manager — Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/static/style.css" rel="stylesheet" />
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-header">
        <div class="login-logo"><i class="bi bi-wifi"></i></div>
        <h1 class="login-title">Bbox WiFi Manager</h1>
        <p class="login-sub">Connectez-vous à votre box</p>
      </div>

      {% if error %}
      <div class="alert alert-danger mx-4 mt-4 mb-0 py-2 small border-0 rounded-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" class="login-form" id="login-form">

        <p class="field-label">Votre box</p>
        <div class="box-grid">
          <div class="box-card active" onclick="selectBox(this, '192.168.1.254')">
            <i class="bi bi-router"></i>
            <div class="box-name">Bbox Bouygues</div>
            <div class="box-addr">192.168.1.254</div>
          </div>
          <div class="box-card" onclick="selectBox(this, 'custom')">
            <i class="bi bi-pencil-square"></i>
            <div class="box-name">Personnalisée</div>
            <div class="box-addr">IP manuelle</div>
          </div>
        </div>
        <input type="hidden" name="host" id="host-val" value="192.168.1.254" />
        <input type="text" id="custom-ip" class="form-control mt-3 d-none"
               placeholder="Ex : 192.168.0.1"
               oninput="document.getElementById('host-val').value = this.value.trim()" />

        <p class="field-label mt-4">Mot de passe admin</p>
        <div class="input-group">
          <span class="input-group-text bg-transparent">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" name="password" id="pwd"
                 class="form-control border-start-0 ps-0"
                 placeholder="Mot de passe de la box" required />
          <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()">
            <i class="bi bi-eye" id="pwd-eye"></i>
          </button>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-connect mt-4" id="btn-submit">
          <span id="btn-text"><i class="bi bi-plug-fill me-2"></i>Se connecter</span>
          <span id="btn-spinner" class="d-none">
            <span class="spinner-border spinner-border-sm me-2"></span>Connexion…
          </span>
        </button>

      </form>
    </div>
  </div>

  <script>
    function selectBox(el, ip) {
      document.querySelectorAll('.box-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const customEl = document.getElementById('custom-ip');
      const hostVal  = document.getElementById('host-val');
      if (ip === 'custom') {
        customEl.classList.remove('d-none');
        hostVal.value = customEl.value.trim();
        customEl.focus();
      } else {
        customEl.classList.add('d-none');
        hostVal.value = ip;
      }
    }

    function togglePwd() {
      const inp = document.getElementById('pwd');
      const eye = document.getElementById('pwd-eye');
      inp.type  = inp.type === 'password' ? 'text' : 'password';
      eye.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      if (!document.getElementById('host-val').value.trim()) {
        e.preventDefault();
        document.getElementById('custom-ip').focus();
        return;
      }
      document.getElementById('btn-text').classList.add('d-none');
      document.getElementById('btn-spinner').classList.remove('d-none');
      document.getElementById('btn-submit').disabled = true;
    });
  </script>

</body>
</html>
